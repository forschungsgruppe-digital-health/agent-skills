# Upstream sources this catalog depends on, and how each one is watched.
#
# Three mechanisms cover three different kinds of upstream, and only the first
# is off-the-shelf. See docs/lifecycle.md section 6 for the reasoning.
#
#   a) .github/dependabot.yml  -- dependencies declared in a manifest
#      (the GitHub Actions in our workflows, and requirements.txt).
#   b) tracked: below          -- versioned upstreams with no manifest of ours,
#      picked up by Renovate's custom manager (.github/renovate.json).
#      OPTIONAL: Renovate requires installing an app or self-hosting, and this
#      repository is fully functional without it.
#   c) watches: below          -- upstreams with no version at all. Fetched,
#      normalized and hashed weekly by scripts/watch_specs.py.
#
# NOTHING updates `last_seen_sha256` automatically, and nothing should.
# Acknowledging an upstream change is a human act: assess the impact, then move
# the hash in a pull request. That pull request is the acknowledgement. An
# automatic update would silently close the loop the watch exists to open.

# ---------------------------------------------------------------------------
# (b) Versioned upstreams tracked by Renovate's custom manager.
# ---------------------------------------------------------------------------
#
# Deliberately short. Most of what this repository depends on already sits in a
# manifest Dependabot reads, and duplicating an entry here would produce two
# pull requests for one bump. Only genuinely unmanifested versions belong below.
#
# Not listed, and why:
#   - googleapis/release-please-action -- pinned in .github/workflows/release.yml,
#     so Dependabot's github-actions ecosystem already covers it.
#   - skills-ref                       -- pinned in requirements.txt, covered by
#     Dependabot's pip ecosystem.
#   - agentskills/agentskills          -- the specification repository publishes
#     NO tags and NO releases (checked). There is no version for Renovate to
#     compare against, which is precisely why it is a (c) entry instead.
tracked:
  # The `skills` CLI documented in README.md and docs/consuming-skills.md. Every
  # flag in those files was verified against this exact version; a major bump can
  # invalidate them, and nothing else in this repository would notice.
  # renovate: datasource=npm depName=skills
  skills_cli: "1.5.21"

# ---------------------------------------------------------------------------
# (c) Unversioned upstreams, hashed weekly by scripts/watch_specs.py.
# ---------------------------------------------------------------------------
#
# Two rules that decide whether this stays useful or gets muted:
#   - Prefer machine-readable endpoints to rendered HTML. HTML churns for
#     reasons unrelated to content, and a watch that cries wolf gets disabled.
#   - For a proposal, watch STATE rather than prose. `state`, `merged` and
#     `updated_at` answer the question that matters; the diff does not.
watches:
  - id: agent-skills-spec
    url: https://agentskills.io/llms.txt
    kind: text
    why: >-
      Format contract. A change here can invalidate the frontmatter rules enforced by
      scripts/build_index.py and documented in CONTRIBUTING.md. Watched via llms.txt, the
      documentation index intended for machine consumption, rather than the rendered
      specification page.
    owner: "@msusky"
    last_seen_sha256: "5557e4c365e84c23f922ff1b60d7fc18aa640186e47edb4b60fdb94d56855a36"

  - id: sep-2640-skills-extension
    url: https://api.github.com/repos/modelcontextprotocol/modelcontextprotocol/pulls/2640
    kind: json
    watch_fields: [state, merged, updated_at]
    why: >-
      Skills over MCP. A merge would make skill://index.json normative rather than
      aspirational, and would turn docs/skills-over-mcp.md from "an open proposal" into a
      specification this catalog should conform to.
    owner: "@msusky"
    last_seen_sha256: "374f124f51a8e5719ea0ab6aacc9bd2037ff1b27c3458348a7c289a3ef941e22"

  - id: agentskills-repo-commits
    url: https://api.github.com/repos/agentskills/agentskills/commits?per_page=1
    kind: json
    watch_fields: [sha]
    why: >-
      Specification repository activity, including changes that never get a release. The
      repository publishes no tags, so this commit head is the only version-like signal
      available for the format contract.
    owner: "@msusky"
    last_seen_sha256: "9aee16ad3bb9225bfe59d92c5f9b2b8c2a157a4638f44866e76011cc13788ef2"
