# The catalog's own gate. Every rule here is deterministic: pass or fail comes
# from an exit code, never from a judgement.
#
# This workflow is deliberately self-contained rather than delegating to
# validate-reusable.yml. It has to test the scripts *in the pull request under
# review*, whereas the reusable workflow checks out the catalog at a pinned tag
# for consumers who do not have the scripts. Sharing one file would mean a pull
# request could only ever be validated by the previously released validator,
# which is exactly backwards.
name: validate

on:
  pull_request:
    # `edited` matters: without it, fixing an invalid pull request title never
    # re-runs the title check and the merge stays blocked on a stale result.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Specification conformance (agentskills validate)
        # The reference validator from the Agent Skills project, published to
        # PyPI as `skills-ref` and pinned in requirements.txt. Note that the
        # console script it installs is named `agentskills`, not `skills-ref`:
        # the specification page and the project's own pyproject.toml both say
        # otherwise, and the installed artifact is the authority.
        run: |
          status=0
          shopt -s nullglob
          for dir in skills/*/; do
            dir="${dir%/}"
            [ -f "$dir/SKILL.md" ] || continue
            agentskills validate "$dir" || status=1
          done
          exit $status

      - name: Catalog contract and generated-artefact drift
        run: python scripts/build_index.py --check

      - name: Trigger collision between descriptions
        run: python scripts/check_descriptions.py

      - name: Directive-rule taxonomies stay in sync across skills
        # fql-rules.tsv (mii-ig-migration, normative) vs directive_patterns
        # (fhir-ig-analysis, derived). They drifted once — 11 vs 12 labels,
        # 129 vs 130 findings on the same corpus; this makes that drift a
        # failure instead of a silent disagreement.
        run: python scripts/check_directive_rules.py

      - name: Every relative link in every Markdown file resolves
        # build_index.py checks links inside skills/ only, because that is where
        # portability decides whether an installed skill still works. Nothing
        # checked README.md, AGENTS.md or docs/ — and a broken link shipped there
        # for exactly that reason, in the paragraph explaining the rule.
        #
        # This reuses build_index's own strip_code() and MD_LINK rather than
        # reimplementing them, so the two can never disagree about what counts
        # as a link.
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys
          sys.path.insert(0, 'scripts')
          import build_index as B

          files = [f for f in subprocess.run(['git', 'ls-files'], capture_output=True, text=True)
                   .stdout.split() if f.endswith(('.md', '.template'))]
          scheme = re.compile(r'^[a-z][a-z0-9+.-]*:')
          broken, checked = [], 0
          for f in files:
              p = pathlib.Path(f)
              for target in B.MD_LINK.findall(B.strip_code(p.read_text(encoding='utf-8'))):
                  if target.startswith('#') or scheme.match(target):
                      continue
                  clean = target.split('#', 1)[0]
                  if not clean:
                      continue
                  checked += 1
                  if not (p.parent / clean).exists():
                      broken.append(f'{f} -> {target}')
          print(f'{len(files)} Markdown file(s), {checked} relative link(s) checked')
          for b in broken:
              print(f'::error::broken relative link: {b}')
          sys.exit(1 if broken else 0)
          PY

  pr-title:
    # The pull request title becomes the trunk commit message, because merges
    # are squash merges configured with squash_merge_commit_title=PR_TITLE. An
    # invalid title therefore does not just look untidy -- it silently breaks
    # release automation, which parses the trunk commits.
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Title must be a Conventional Commit
        env:
          # Passed through the environment rather than interpolated into the
          # script. A pull request title is attacker-controlled text, and
          # ${{ }} interpolation would splice it straight into the shell.
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          pattern='^(feat|fix|docs|refactor|test|chore|perf|build|ci|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::Pull request title is not a Conventional Commit: '$TITLE'"
            echo "Expected: <type>[(scope)][!]: <description>"
            echo "Allowed types: feat, fix, docs, refactor, test, chore, perf, build, ci, style, revert"
            echo "The title becomes the commit message on main and is what Release Please parses."
            exit 1
          fi
          case "$TITLE" in
            *.) echo "::error::Pull request title must not end with a period."; exit 1 ;;
          esac
          # Length is a readability convention, not a correctness requirement, so
          # bots are exempt from it -- and they have to be. Dependabot bumping an
          # action pinned to a 40-character commit SHA produces a title well over
          # 100 characters, and failing every dependency update on a style rule
          # would train everyone to ignore this check. The GRAMMAR check above
          # still applies to bots, because that one IS correctness: their title
          # becomes the trunk commit that Release Please parses.
          case "$AUTHOR" in
            dependabot\[bot\]|renovate\[bot\]|github-actions\[bot\])
              echo "OK (bot author '$AUTHOR'; length check skipped): $TITLE"
              exit 0 ;;
          esac
          if [ "${#TITLE}" -gt 100 ]; then
            echo "::error::Pull request title is ${#TITLE} characters; keep it under 100."
            exit 1
          fi
          echo "OK: $TITLE"

      - name: Body must not contain a line that parses as a commit header
        env:
          BODY: ${{ github.event.pull_request.body }}
        # The pull request BODY becomes the squash commit's body, and Release
        # Please runs the Conventional Commits parser over the whole message. A
        # line there that looks like `feat!: something` is read as a SECOND commit
        # and lands in the changelog as a bogus section.
        #
        # This is not hypothetical: it happened in v0.5.0. A line reading
        # "Contract classification: breaking - `feat!:` -> MINOR pre-1.0." wrapped
        # so that the token started a line, and the release notes gained a
        # "### `feat" heading and a breaking-change entry reading "` -> MINOR".
        #
        # Mention a commit type in prose ("a breaking change", "a feat commit"),
        # or indent the line so it cannot start a header. Never let
        # `<type>:` or `<type>!:` begin a line in the body.
        run: |
          if [ -z "${BODY:-}" ]; then echo "empty body; nothing to check"; exit 0; fi
          pattern='^[[:space:]]*[^[:alnum:][:space:]]?(feat|fix|docs|refactor|test|chore|perf|build|ci|style|revert)(\([^)]*\))?!?:'
          if printf '%s' "$BODY" | grep -nEi "$pattern"; then
            echo "::error::The pull request body has a line that the Conventional Commits parser will read as a commit header (shown above). It would corrupt the generated changelog. Rephrase it in prose or indent it."
            exit 1
          fi
          echo "OK: no commit-header-shaped lines in the body"
